# The URL the site will be built for
base_url = "https://www.ialan.eu"

# The site title and description; used in feeds by default.
title = "L4TT1C3"
description = "Alain Jacomet-Forte — AI engineering lead in Berlin. Notes on software, experiments, and building useful things."
author = "Alain Jacomet-Forte"
default_language = "en"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

generate_sitemap = true
generate_robots_txt = true

# Taxonomies config
taxonomies = [
  { name = "tags", feed = true }
]

[markdown]

[markdown.highlighting]
# Emit semantic `.z-*` token classes (no inline colours) so the
# highlight palette follows the site's active color theme + brightness
# toggle. The actual colours are mapped to `--md-code-block-*` tokens in
# sass/_markdown.scss, which already vary per `data-color-theme` and
# `[data-theme="light"]`. Zola still generates giallo.css for reference but
# it is intentionally NOT linked — our token mapping is the single source.
theme = "tokyo-night"
style = "class"

[extra]
site_name = "L4TT1C3"
author_name = "Alain Jacomet-Forte"
author_first_name = "Alain"
author_last_name = "Jacomet-Forte"
author_role = "AI Engineering Lead & Software Engineer"
author_location = "Berlin, Germany"
author_intro = "I build AI-powered products and the teams behind them. This is where I share notes on engineering, explore ideas, and make things for the joy of it."
author_focus = "LLMs, agents & the web"
codeberg_url = "https://codeberg.org/ialan"
github_url = "https://github.com/alainux"
linkedin_url = "https://linkedin.com/in/alainux"

# ── Color theme ──────────────────────────────────────────────
# Active terminal color theme. Owner-configured only — visitors
# cannot switch it (the [☾/☀] button toggles brightness within the
# active theme, not the palette family).
# Options: tokyo-night (default) | gruvbox | catppuccin | solarized
theme = "tokyo-night"

# Date & display
date_format = "%Y-%m-%d"

# List labels
latest_posts = "RECENT WRITING"
latest_projects = "PROJECTS & EXPERIMENTS"

# Button labels
back_to_home = "BACK TO HOME"
view_all_posts = "VIEW ALL POSTS"
view_all_projects = "VIEW ALL PROJECTS"

# Default social-share image (1200x630 PNG in static/). Per-page override
# via frontmatter `extra.og_image`.
og_image = "images/og.png"
